# JVM Gradle — il server è condiviso con i servizi di produzione: budget RAM ridotto.
# NB: niente kotlin.compiler.execution.strategy=in-process — con KSP1 (Room) la
# risoluzione tipi si rompe (MissingType su tutte le entità); il daemon Kotlin
# separato è comunque limitato a 1GB.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
# NB: niente ksp.useKSP2 — validato solo lo stack KSP1 (default) con Kotlin 2.1.10+KSP 1.0.31.

# AndroidX obbligatorio, stile Kotlin ufficiale
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk/targetSdk 36 (Play: obbligatorio per app nuove dal 31/08/2026).
# AGP 8.7.3 è più vecchio del minimo ufficiale (8.9.1) → suppress del warning.
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
